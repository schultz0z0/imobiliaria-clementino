name: ${COMPOSE_PROJECT_NAME:-imobiliaria-clementino}

services:
  website:
    image: imobiliaria-clementino:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imobiliaria.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.imobiliaria.entrypoints=websecure"
      - "traefik.http.routers.imobiliaria.tls=true"
      - "traefik.http.routers.imobiliaria.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imobiliaria.service=imobiliaria"
      - "traefik.http.routers.imobiliaria-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.imobiliaria-www.entrypoints=websecure"
      - "traefik.http.routers.imobiliaria-www.tls=true"
      - "traefik.http.routers.imobiliaria-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imobiliaria-www.middlewares=imobiliaria-www-redirect"
      - "traefik.http.routers.imobiliaria-www.service=imobiliaria"
      - 'traefik.http.middlewares.imobiliaria-www-redirect.redirectregex.regex=^https?://www\.(.+)'
      - 'traefik.http.middlewares.imobiliaria-www-redirect.redirectregex.replacement=https://$${1}'
      - "traefik.http.middlewares.imobiliaria-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.imobiliaria.loadbalancer.server.port=80"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin.prod
    restart: unless-stopped
    expose: ["80"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imobiliaria-admin.rule=Host(`${ADMIN_DOMAIN:-admin.${DOMAIN}}`)"
      - "traefik.http.routers.imobiliaria-admin.entrypoints=websecure"
      - "traefik.http.routers.imobiliaria-admin.tls=true"
      - "traefik.http.routers.imobiliaria-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.imobiliaria-admin.loadbalancer.server.port=80"

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    expose: ["3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEDIA_ROOT: /data/media
      PUBLISHED_ROOT: /data/published
    volumes:
      - media_data:/data/media
      - published_releases:/data/published
    depends_on:
      postgres:
        condition: service_healthy

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    command: ["node", "dist-server/publisher/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEDIA_ROOT: /data/media
      PUBLISHED_ROOT: /data/published
    volumes:
      - media_data:/data/media
      - published_releases:/data/published
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clementino}
      POSTGRES_USER: ${POSTGRES_USER:-clementino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
  published_releases:
