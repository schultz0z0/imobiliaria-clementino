name: imobiliaria-clementino-dev

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "4174:4174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      DISABLE_HMR: "false"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
