name: clementino-property-admin-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: property_admin_test
      POSTGRES_USER: property_admin_test
      POSTGRES_PASSWORD: property_admin_test
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - property-admin-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_admin_test -d property_admin_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: "no"

volumes:
  property-admin-postgres-test-data:
