server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Core Web Vitals compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The publisher atomically swaps /data/published/current. Keep the bundled
  # build as a safe fallback while a first release is not available.
  location = /sitemap.xml {
    root /data/published/current;
    try_files /sitemap.xml @bundled_sitemap;
  }

  location @bundled_sitemap {
    return 404;
  }

  location = /robots.txt {
    root /data/published/current;
    try_files /robots.txt @bundled_robots;
  }

  location @bundled_robots {
    root /usr/share/nginx/html;
    try_files /robots.txt =404;
  }

  location = /llms.txt {
    root /data/published/current;
    try_files /llms.txt @bundled_llms;
  }

  location @bundled_llms {
    root /usr/share/nginx/html;
    try_files /llms.txt =404;
  }

  location = /llms-full.txt {
    root /data/published/current;
    try_files /llms-full.txt @bundled_llms_full;
  }

  location @bundled_llms_full {
    root /usr/share/nginx/html;
    try_files /llms-full.txt =404;
  }

  location /assets/ {
    root /data/published/current;
    try_files $uri @bundled_assets;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location @bundled_assets {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # Static images must never fall back to the SPA HTML. A missing image served
  # as index.html can be cached by browsers and remain undecodable after deploy.
  location /images/ {
    root /data/published/current;
    try_files $uri @bundled_images;
  }

  location @bundled_images {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location ~ ^/imoveis/[0-9]+/[^/]+\.webp$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /imoveis/ {
    return 308 /imoveis;
  }

  location / {
    add_header Cache-Control "no-cache";
    root /data/published/current;
    try_files $uri.html $uri @bundled_app;
  }

  location @bundled_app {
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }
}
