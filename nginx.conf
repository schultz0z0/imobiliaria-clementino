server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The publisher atomically swaps /data/published/current. Keep the bundled
  # build as a safe fallback while a first release is not available.
  location = /sitemap.xml {
    root /data/published/current;
    try_files /sitemap.xml @bundled_sitemap;
  }

  location /assets/ {
    root /data/published/current;
    try_files $uri @bundled_assets;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location @bundled_assets {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location @bundled_sitemap {
    return 404;
  }

  location ~ ^/imoveis/[0-9]+/[^/]+\.webp$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    root /data/published/current;
    try_files $uri $uri/ @bundled_app;
  }

  location @bundled_app {
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }
}
