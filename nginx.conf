server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $public_api http://public-seo:3000;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Documents read the published database catalog, never the legacy inventory.
  location = /sitemap.xml { proxy_pass $public_api/api/public/seo/sitemap.xml; }
  location = /robots.txt { proxy_pass $public_api/api/public/seo/robots.txt; }
  location = /llms.txt { proxy_pass $public_api/api/public/seo/llms.txt; }
  location = /llms-full.txt { proxy_pass $public_api/api/public/seo/llms-full.txt; }

  location /assets/ {
    try_files $uri @published_assets;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location @published_assets {
    root /data/published/current;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # New brand assets take precedence over files copied into old releases.
  # Missing images must never return application HTML.
  location /images/ {
    try_files $uri @published_images;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
  location @published_images {
    root /data/published/current;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
  location ~ ^/imoveis/[0-9]+/[^/]+\.webp$ {
    try_files $uri =404;
    expires 1y;
  }
  location ~ ^/(favicon(-[0-9]+)?\.png|favicon\.ico|apple-touch-icon\.png)$ {
    try_files $uri =404;
    expires 1d;
  }
  location = /favicon.svg { return 308 /favicon-32.png; }
  location = /index.html { return 308 /; }
  location = /imoveis/ { return 308 /imoveis; }

  location / {
    proxy_pass $public_api/api/public/seo/document?path=$uri;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
