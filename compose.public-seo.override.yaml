# Merge this over the VPS's EXISTING compose file using its original project
# name and environment. Do not replace that file or restore local data.
x-seo-build-args: &seo-build-args
  VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
  VITE_GOOGLE_ADS_ID: ${VITE_GOOGLE_ADS_ID:-}
  VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID-1324132266370583}
  VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}

services:
  public-seo:
    image: clementino-public-seo:${SEO_RELEASE_TAG:?Set a unique SEO_RELEASE_TAG}
    build:
      context: ${SEO_SOURCE_ROOT:?Set the absolute path of the reviewed source}
      dockerfile: Dockerfile
      target: api
      args: *seo-build-args
    restart: unless-stopped
    command: ["node", "dist-server/seo/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Use the VPS production database URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/seo/document?path=/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  website:
    image: clementino-public-website:${SEO_RELEASE_TAG:?Set a unique SEO_RELEASE_TAG}
    build:
      context: ${SEO_SOURCE_ROOT:?Set the absolute path of the reviewed source}
      dockerfile: Dockerfile
      target: website
      args: *seo-build-args
